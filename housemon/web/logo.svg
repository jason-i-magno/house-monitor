<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A house cut away to its rooms, each colored as the map colors a room by its temperature (style.css's --temp-*
       tokens): warm upstairs, cool downstairs. Drawn on a grid of 2, so at 16 px its walls fall on whole pixels. -->
  <style>.house{fill:#3d3b38}@media (prefers-color-scheme:dark){.house{fill:#e2e0dc}}</style>
  <path class="house" d="M16 1.5 1.9 15.6a1.3 1.3 0 0 0 .9 2.2H4V28a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V17.8h1.2a1.3 1.3 0 0 0 .9-2.2Z"/>
  <rect x="6" y="14" width="10" height="6" rx=".5" fill="#c74845"/>
  <rect x="18" y="14" width="8" height="6" rx=".5" fill="#ea9a93"/>
  <rect x="6" y="22" width="6" height="6" rx=".5" fill="#86b6ef"/>
  <rect x="14" y="22" width="12" height="6" rx=".5" fill="#2a78d6"/>
</svg>
